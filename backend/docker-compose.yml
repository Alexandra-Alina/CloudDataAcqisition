services:
  api:
    build: .
    image: metrics-backend:latest
    container_name: metrics-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - exports_data:/app/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  exports_data:
    name: metrics_exports_data
